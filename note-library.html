<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kedem: Note Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown parsing (MUST be loaded before markdown-parser.js) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Fonts and general styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* slate-50 */
            color: #334155; /* slate-700 */
        }
        /* Custom scrollbar for better appearance, always visible to reserve space */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px; /* For horizontal scrollbars */
        }
        ::-webkit-scrollbar-track {
            background: transparent; /* Make track transparent for overlay effect */
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8; /* slate-400 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; /* slate-600 */
        }
        /* Active nav link styling for main pages/sections */
        .nav-link.active {
            background-color: #fbbf24; /* amber-400 */
            color: #1e293b; /* slate-800 */
            font-weight: 600;
        }
        /* Styles for markdown content */
        .markdown-content h1 { font-size: 2.5rem; /* H1: 40px */ font-weight: 700; margin-bottom: 1rem; }
        .markdown-content h2 { font-size: 2rem; /* H2: 32px */ font-weight: 600; margin-bottom: 0.75rem; }
        .markdown-content h3 { font-size: 1.75rem; /* H3: 28px */ font-weight: 600; margin-bottom: 0.5rem; }
        .markdown-content h4 { font-size: 1.5rem; /* H4: 24px */ font-weight: 600; margin-bottom: 0.5rem; }
        .markdown-content h5 { font-size: 1.25rem; /* H5: 20px */ font-weight: 600; margin-bottom: 0.5rem; }
        .markdown-content h6 { font-size: 1rem; /* H6: 16px */ font-weight: 600; margin-bottom: 0.5rem; }
        .markdown-content p { margin-bottom: 0.75rem; line-height: 1.6; }
        .markdown-content ul, .markdown-content ol { list-style-position: inside; margin-bottom: 0.75rem; padding-left: 1.5rem; }
        .markdown-content ul li { list-style-type: disc; }
        .markdown-content ol li { list-style-type: decimal; }
        .markdown-content b, .markdown-content strong { font-weight: 700; }
        .markdown-content em, .markdown-content i { font-style: italic; }
        .markdown-content hr { border-top: 1px solid #e2e8f0; margin: 1.5rem 0; }
        .markdown-content pre { background-color: #f1f5f9; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
        .markdown-content code { background-color: #f1f5f9; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-family: monospace; }
        .markdown-content blockquote { border-left: 4px solid #94a3b8; padding-left: 1rem; margin: 1rem 0; color: #64748b; }
        .markdown-content table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        .markdown-content th, .markdown-content td { border: 1px solid #cbd5e1; padding: 0.75rem; text-align: left; }
        .markdown-content th { background-color: #e2e8f0; }
        /* Style for wikilinks */
        .markdown-content a.wikilink {
            color: #2563eb; /* blue-600 */
            text-decoration: none;
            font-weight: 500;
        }
        .markdown-content a.wikilink:hover {
            text-decoration: underline;
        }

        /* Specific styling for properties box */
        .properties-box {
            background-color: #f1f5f9; /* slate-100 */
            border: 1px solid #e2e8f0; /* slate-200 */
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            line-height: 1.5; /* Adjusted for better readability inside box */
        }
        .properties-box-title {
            font-size: 0.875rem; /* text-sm */
            font-weight: 600;
            color: #475569; /* slate-600 */
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
        }
        .properties-item {
            display: flex;
            align-items: flex-start; /* Align items to start for multi-line values */
            margin-bottom: 0.5rem;
            font-size: 0.875rem; /* text-sm */
            color: #334155; /* slate-700 */
        }
        .properties-item:last-child {
            margin-bottom: 0;
        }
        .properties-label {
            font-weight: 500; /* font-medium */
            color: #1e293b; /* slate-800 */
            width: 80px; /* Fixed width for labels */
            flex-shrink: 0; /* Prevent label from shrinking */
            margin-right: 0.5rem;
            padding-top: 0.125rem; /* Small padding for vertical alignment */
        }
        .properties-value {
            flex-grow: 1;
            display: flex; /* For tags, to allow flex wrapping */
            flex-wrap: wrap; /* Allow tags to wrap */
            gap: 0.25rem; /* Gap between tags */
        }
        .tag-chip {
            display: inline-flex; /* Use inline-flex for better alignment */
            align-items: center;
            background-color: #cbd5e1; /* slate-300 */
            color: #1e293b; /* slate-800 */
            font-size: 0.75rem; /* text-xs */
            font-weight: 500;
            padding: 0.2rem 0.6rem;
            border-radius: 4px; /* Slightly less rounded than full for a squarer look */
            line-height: 1; /* Adjust line height for better vertical centering */
            height: 1.5rem; /* Fixed height for consistent tag size */
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            font-size: 1.5rem;
            color: #1e293b;
        }
        /* Styling for the note list items to fit the sidebar */
        .note-list-item-link,
        .note-list-folder-toggle {
            display: flex; /* Use flex to align icon and text */
            align-items: center;
            padding: 0.25rem 0.5rem; /* Adjusted padding to be more compact */
            border-radius: 0.25rem; /* Slightly less rounded */
            color: #f1f5f9; /* slate-100 */
            transition: background-color 0.2s, color 0.2s;
            text-decoration: none;
            width: 100%; /* Make them take full width of their LI parent */
            box-sizing: border-box; /* Include padding in width calculation */

            /* Text overflow properties */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.5; /* Ensure good line height */
        }
        .note-list-item-link:hover,
        .note-list-folder-toggle:hover {
            background-color: #334155; /* slate-700 */
        }
        .note-list-item-link.active-note {
            background-color: #fbbf24; /* amber-400 */
            color: #1e293b; /* slate-800 */
            font-weight: 400; /* No bold */
        }
        .note-list-folder-toggle {
            cursor: pointer;
            font-weight: 400; /* No bold */
            user-select: none;
        }
        .toggle-icon {
            margin-right: 0.5rem; /* mr-2 */
            width: 1rem; /* Fixed width for icon */
            flex-shrink: 0; /* Prevent icon from shrinking */
            transform-origin: center center; /* Ensure rotation is from center */
            transition: transform 0.15s ease-in-out; /* Smooth rotation */
        }
        .toggle-icon.rotated {
            transform: rotate(90deg);
        }
        /* Styling for the nested ULs to create the indent line */
        .folder-item-sub-list {
            margin-left: 1.25rem; /* Increased indent */
            border-left: 1px solid #475569; /* slate-600 border */
            padding-left: 0.25rem; /* Padding for content inside the bordered area */
            padding-top: 0.25rem; /* Small padding at the top of the sub-list */
            padding-bottom: 0.25rem; /* Small padding at the bottom of the sub-list */
        }
        /* Ensure LI elements within the nested UL do not add extra padding,
           their padding is handled by the link/toggle inside */
        .folder-item-sub-list > li {
            padding-left: 0;
        }
        /* Specific styling for the 'Note Library' active text in sidebar */
        .sidebar-active-text {
            background-color: #fbbf24; /* amber-400 */
            color: #1e293b; /* slate-800 */
            font-weight: 600;
            display: block;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            user-select: none;
        }

        /* Adjust the note list container's padding to make the scrollbar feel more overlay */
        #note-list-container {
            padding-right: 0.25rem; /* Slightly reduce padding to give scrollbar more "hover" room */
            overflow-y: scroll; /* Force scrollbar to always be present */
        }
        /* Also apply to the main note content area */
        #note-content {
            overflow-y: scroll; /* Force scrollbar to always be present */
            padding-right: 0.25rem; /* Same logic for content area */
        }
    </style>
</head>
<body class="antialiased">

    <!-- Loading Overlay for general app loading -->
    <div id="loading-overlay" class="loading-overlay hidden">
        Loading data...
    </div>

    <div class="flex h-screen bg-slate-50">
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-slate-800 text-slate-100 flex flex-col fixed h-full">
            <div class="h-16 flex items-center justify-center border-b border-slate-700">
                <a href="explorer.html#world" id="home-link" class="text-2xl font-bold text-amber-400 hover:text-amber-300 transition-colors duration-200">Kedem Anvil</a>
            </div>

            <nav class="flex-none px-4 py-4 space-y-2">
                <!-- Only link to the Explorer page -->
                <a href="explorer.html#world" class="nav-link flex items-center px-4 py-2 rounded-lg transition-colors duration-200 hover:bg-slate-700">The World (Explorer)</a>
                <!-- Static text for the current page (Note Library) -->
                <span class="sidebar-active-text flex items-center">Note Library</span>
            </nav>

            <!-- Note-specific sidebar content below main navigation -->
            <div class="flex-auto p-4 border-t border-slate-700" id="note-list-container">
                <h3 class="text-xl font-bold text-teal-300 mb-3">Notes</h3>
                <ul id="note-list" class="space-y-1">
                    <!-- Note list will be injected here by JavaScript -->
                </ul>
            </div>
            <!-- Auth controls are now dynamically added by ui-manager.js -->
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-64 p-6 sm:p-8 lg:p-12 overflow-y-auto">
            <!-- Breadcrumbs will be injected here -->
            <nav id="breadcrumbs-container" class="text-sm text-slate-500 mb-4">
                <!-- Breadcrumbs will be dynamically inserted here by JavaScript -->
            </nav>

            <div class="grid grid-cols-3 gap-6 h-full">
                <!-- Main Note Display Area (2/3 width) -->
                <div class="col-span-2 flex flex-col h-full">
                    <h2 id="note-display-title" class="text-4xl font-bold text-slate-800 mb-6 border-b-4 border-amber-400 pb-2">Select a Note</h2>
                    <div id="note-content" class="markdown-content bg-white p-6 rounded-xl shadow-sm text-base text-slate-700 leading-relaxed flex-1 overflow-y-auto">
                        <p>Select a note from the left panel to display its content.</p>
                    </div>
                </div>

                <!-- Right Chat/LLM Placeholder Panel (1/3 width) -->
                <div id="chat-panel" class="col-span-1 bg-white p-6 rounded-xl shadow-sm flex flex-col h-full">
                    <h3 class="text-2xl font-bold text-teal-700 mb-4">Chat/AI Assistant</h3>
                    <div class="flex-1 overflow-y-auto bg-slate-50 p-3 rounded-lg border border-slate-200 text-sm text-slate-700">
                        <p>This panel can be used for chat or AI interactions.</p>
                        <p class="mt-2 text-slate-500 italic">Future LLM integration will go here.</p>
                    </div>
                    <div class="mt-4">
                        <input type="text" placeholder="Type your message..." class="w-full p-2 border border-slate-300 rounded-md text-sm focus:ring-amber-400 focus:border-amber-400">
                        <button class="w-full mt-2 bg-amber-600 text-white py-2 rounded-md hover:bg-amber-700 transition shadow text-sm">Send</button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Firebase and other core modules loaded at the end of the body for DOM readiness -->
    <script type="module">
        // Export noteFiles to the global window object for marked.js
        import { noteFiles } from './data-constants.js';
        window.noteFiles = noteFiles;
    </script>
    <script type="module" src="./firebase-init.js"></script>
    <script type="module" src="./markdown-parser.js"></script>
    <script type="module" src="./note-library-manager.js"></script>
    <script type="module" src="./ui-manager.js"></script>
</body>
</html>
