<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kedem: Note Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown parsing (MUST be loaded before markdown-parser.js) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Fonts and general styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* CSS Variables for theming */
        :root {
            /* Fallback values */
            --bg-color: #f8fafc; --text-color: #334155; --sidebar-bg: #1e293b;
            --sidebar-text: #f1f5f9; --sidebar-border: #475569; --nav-hover-bg: #334155;
            --nav-active-bg: #fbbf24; --nav-active-text: #1e293b; --note-bg: #ffffff;
            --note-border: #e2e8f0; --properties-bg: #f1f5f9; --properties-border: #e2e8f0;
            --properties-title-color: #475569; --properties-label-color: #1e293b;
            --tag-chip-bg: #cbd5e1; --tag-chip-text: #1e293b; --wikilink-color: #2563eb;
            --broken-link-color: #94a3b8; --loading-overlay-bg: rgba(255, 255, 255, 0.8);
            --font-h1: 32px; --font-h2: 24px; --font-h3: 18px; --font-h4: 16px;
            --font-h5: 13px; --font-h6: 10px; --font-p: 16px;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--sidebar-border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--properties-title-color); }
        
        /* Navigation Link Styles */
        .nav-link.active, .sidebar-active-text {
            background-color: var(--nav-active-bg);
            color: var(--nav-active-text);
            font-weight: 600;
        }
        .sidebar-active-text {
             display: block; padding: 0.5rem 1rem; border-radius: 0.5rem; user-select: none;
        }

        /* Markdown content styles */
        .markdown-content h1 { font-size: var(--font-h1); } .markdown-content h2 { font-size: var(--font-h2); }
        .markdown-content h3 { font-size: var(--font-h3); } .markdown-content h4 { font-size: var(--font-h4); }
        .markdown-content p { font-size: var(--font-p); line-height: 1.6; }
        .markdown-content ul, .markdown-content ol { padding-left: 1.5rem; }
        .markdown-content pre { background-color: var(--properties-bg); padding: 1rem; border-radius: 0.5rem; }
        .markdown-content code { background-color: var(--tag-chip-bg); padding: 0.2rem 0.4rem; border-radius: 0.25rem; }
        .markdown-content a.wikilink { color: var(--wikilink-color); text-decoration: none; font-weight: 500; }
        .markdown-content a.wikilink:hover { text-decoration: underline; }

        /* Properties box styles */
        .properties-box { background-color: var(--properties-bg); border: 1px solid var(--properties-border); border-radius: 0.5rem; padding: 1rem; margin-bottom: 1.5rem; }
        .properties-box-title { font-weight: 600; color: var(--properties-title-color); margin-bottom: 0.75rem; display: flex; align-items: center; }
        .properties-item { display: flex; align-items: flex-start; margin-bottom: 0.5rem; font-size: 0.875rem; }
        .properties-label { font-weight: 500; color: var(--properties-label-color); width: 80px; flex-shrink: 0; margin-right: 0.5rem; }
        .properties-value { flex-grow: 1; display: flex; flex-wrap: wrap; gap: 0.25rem; }
        .tag-chip { display: inline-flex; background-color: var(--tag-chip-bg); color: var(--tag-chip-text); font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 4px; }
        
        /* Loading Overlay */
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--loading-overlay-bg); display: flex; justify-content: center; align-items: center; z-index: 100; }
        
        /* Note list specific styles */
        .note-list-item-link, .note-list-folder-toggle { display: flex; align-items: center; padding: 0.25rem 0.5rem; border-radius: 0.25rem; color: var(--sidebar-text); transition: background-color 0.2s, color 0.2s; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .note-list-item-link:hover, .note-list-folder-toggle:hover { background-color: var(--nav-hover-bg); }
        .note-list-item-link.active-note { background-color: var(--nav-active-bg); color: var(--nav-active-text); }
        .note-list-folder-toggle { cursor: pointer; user-select: none; }
        .toggle-icon { margin-right: 0.5rem; width: 1rem; flex-shrink: 0; transition: transform 0.15s ease-in-out; }
        .toggle-icon.rotated { transform: rotate(90deg); }
        .folder-item-sub-list { margin-left: 1.25rem; border-left: 1px solid var(--sidebar-border); padding-left: 0.75rem; }
    </style>
</head>
<body class="antialiased">

    <div id="loading-overlay" class="loading-overlay hidden">Loading data...</div>

    <div class="flex h-screen bg-slate-50">
        <!-- MODIFIED: Sidebar is now a placeholder that will be loaded dynamically -->
        <div id="sidebar-placeholder"></div>

        <!-- Main Content -->
        <main class="flex-1 ml-64 p-6 sm:p-8 lg:p-12 h-screen flex flex-col">
            <nav id="breadcrumbs-container" class="text-sm text-slate-500 mb-4 flex-none"></nav>

            <div class="grid grid-cols-3 gap-6 flex-1 min-h-0">
                <!-- Main Note Display Area (2/3 width) -->
                <div class="col-span-2 flex flex-col min-h-0">
                    <h2 id="note-display-title" class="text-4xl font-bold text-slate-800 mb-6 border-b-4 border-amber-400 pb-2 flex-none">Select a Note</h2>
                    <div id="note-content" class="markdown-content bg-white p-6 rounded-xl shadow-sm text-base leading-relaxed flex-1 overflow-y-auto">
                        <p>Select a note from the left panel to display its content.</p>
                    </div>
                </div>

                <!-- Right Chat/LLM Placeholder Panel (1/3 width) -->
                <div id="chat-panel" class="col-span-1 bg-white p-6 rounded-xl shadow-sm flex flex-col min-h-0">
                    <h3 class="text-2xl font-bold text-teal-700 mb-4 flex-none">Chat/AI Assistant</h3>
                    <div class="flex-1 p-3 rounded-lg border text-sm overflow-y-auto">
                        <p>This panel can be used for chat or AI interactions.</p>
                        <p class="mt-2 italic">Future LLM integration will go here.</p>
                    </div>
                    <div class="mt-4 flex-none">
                        <input type="text" placeholder="Type your message..." class="w-full p-2 border rounded-md text-sm">
                        <button class="w-full mt-2 bg-amber-600 text-white py-2 rounded-md hover:bg-amber-700">Send</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- MODIFIED: Removed the inline script that set window properties -->
    <!-- Theme variables are now applied via an inline script for speed -->
    <script type="module">
        import { colorThemes, markdownFontSizes } from './appearance-settings.js';
        const theme = colorThemes[document.documentElement.getAttribute('data-theme') || 'light'];
        for (const [prop, value] of Object.entries(theme)) {
            document.documentElement.style.setProperty(prop, value);
        }
        for (const [key, value] of Object.entries(markdownFontSizes)) {
            document.documentElement.style.setProperty(`--font-${key}`, value);
        }
    </script>
    
    <!-- All modules are now self-contained and import their own dependencies -->
    <script type="module" src="./firebase-init.js"></script>
    <script type="module" src="./markdown-parser.js"></script>
    <script type="module" src="./note-library-manager.js"></script>
    <script type="module" src="./ui-manager.js"></script>
</body>
</html>
