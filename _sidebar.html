<!-- _sidebar.html -->
<!-- This is a reusable component. It will be loaded into the placeholder div on each page. -->
<aside class="w-64 bg-slate-800 text-slate-100 flex flex-col fixed h-full">
    <!-- Header -->
    <div class="h-16 flex items-center justify-center border-b border-slate-700">
        <a href="explorer.html#world" id="home-link" class="text-2xl font-bold text-amber-400 hover:text-amber-300 transition-colors duration-200">Kedem Anvil</a>
    </div>

    <!-- Main Navigation (Common to all pages) -->
    <!-- The 'active' class will be added dynamically by ui-manager.js -->
    <nav class="flex-none px-4 py-4 space-y-2" id="main-navigation">
        <a href="explorer.html#world" data-nav-id="explorer" class="nav-link flex items-center px-4 py-2 rounded-lg transition-colors duration-200 hover:bg-slate-700">The World (Explorer)</a>
        
        <!-- This is a special container for the Note Library link/section -->
        <div id="note-library-nav-container">
            <!-- This will be populated by ui-manager.js depending on the page -->
        </div>

    </nav>

    <!-- Page-Specific Content Area (for Note Library's list) -->
    <div id="sidebar-page-specific-content" class="flex-auto p-4 border-t border-slate-700 overflow-y-auto">
        <!-- This content will be dynamically inserted by the manager for the current page -->
        <!-- On note-library.html, the note list will go here. -->
        <!-- On explorer.html, this can remain empty or have other content. -->
    </div>
    
    <!-- Auth controls will be appended here by ui-manager.js -->
</aside>
