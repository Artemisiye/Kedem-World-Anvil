<!-- _sidebar.html -->
<!-- This is a reusable component. It will be loaded into the placeholder div on each page. -->
<aside class="w-64 bg-slate-800 text-slate-100 flex flex-col fixed h-full">
    <!-- Header -->
    <div class="h-16 flex items-center justify-center border-b border-slate-700">
        <a href="explorer.html" id="home-link" class="text-2xl font-bold text-amber-400 hover:text-amber-300 transition-colors duration-200">Kedem Anvil</a>
    </div>

    <!-- Main Navigation (Common to all pages) -->
    <!-- This container will be dynamically populated by ui-manager.js -->
    <nav class="flex-none px-4 py-4 space-y-2" id="main-navigation">
    </nav>

    <!-- Page-Specific Content Area (for Note Library's list) -->
    <div id="sidebar-page-specific-content" class="flex-auto p-4 border-t border-slate-700 overflow-y-auto min-h-0">
        <!-- On note-library.html, the note list will be dynamically inserted here. -->
    </div>
    
    <!-- Auth controls will be appended to the bottom of the sidebar by ui-manager.js -->
</aside>
