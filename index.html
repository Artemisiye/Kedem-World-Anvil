<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Kedem Explorer...</title>
    <!-- Redirect using JavaScript for compatibility with hash URLs if needed,
         and to prevent browser caching issues with meta refresh if destination changes -->
    <script>
        window.location.replace("explorer.html");
    </script>
    <!-- Fallback for browsers with JavaScript disabled (less common but good practice) -->
    <noscript>
        <meta http-equiv="refresh" content="0; url=explorer.html">
    </noscript>
    <link rel="canonical" href="explorer.html">
</head>
<body>
    <p>If you are not redirected automatically, follow this <a href="explorer.html">link to the Kedem Explorer</a>.</p>
</body>
</html>
